<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 220" width="900" height="220" fill="none" role="img" aria-label="Career pipeline: embedded, web3, fintech, AI/ML">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="220" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="219" rx="16" fill="none" stroke="#00ff9c" stroke-opacity="0.16"/>

  <!-- faint grid -->
  <g fill="#00ff9c" fill-opacity="0.06">
    <circle cx="60" cy="55" r="1.3"/><circle cx="180" cy="55" r="1.3"/><circle cx="300" cy="55" r="1.3"/><circle cx="420" cy="55" r="1.3"/><circle cx="540" cy="55" r="1.3"/><circle cx="660" cy="55" r="1.3"/><circle cx="780" cy="55" r="1.3"/>
    <circle cx="60" cy="200" r="1.3"/><circle cx="180" cy="200" r="1.3"/><circle cx="300" cy="200" r="1.3"/><circle cx="420" cy="200" r="1.3"/><circle cx="540" cy="200" r="1.3"/><circle cx="660" cy="200" r="1.3"/><circle cx="780" cy="200" r="1.3"/>
  </g>

  <!-- titles -->
  <text x="28" y="32" font-family="'Fira Code',monospace" font-size="14" fill="#00ff9c" fill-opacity="0.85">$ ./career --years 14</text>
  <text x="872" y="32" font-family="'Fira Code',monospace" font-size="11" fill="#00ff9c" fill-opacity="0.45" text-anchor="end">building infra that doesn't go down</text>

  <!-- ===== data bus ===== -->
  <path id="bus" d="M28 130 H832" stroke="#00ff9c" stroke-opacity="0.30" stroke-width="2"/>
  <path d="M28 130 H832" stroke="#00ff9c" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 10" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="56" to="0" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- ===== modules (boxes drawn over the bus) ===== -->
  <g fill="#0d1117" stroke="#00ff9c" stroke-opacity="0.55" stroke-width="1.8">
    <rect x="92"  y="92" width="76" height="76" rx="11"/>
    <rect x="282" y="92" width="76" height="76" rx="11"/>
    <rect x="472" y="92" width="76" height="76" rx="11"/>
    <rect x="662" y="92" width="76" height="76" rx="11"/>
  </g>

  <!-- sequential activation glow (packet sweeps left->right over 5s) -->
  <g fill="none" stroke="#00ff9c" stroke-width="2.6" filter="url(#glow)">
    <rect x="92"  y="92" width="76" height="76" rx="11" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.06;0.127;0.20;1" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="282" y="92" width="76" height="76" rx="11" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.29;0.363;0.43;1" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="472" y="92" width="76" height="76" rx="11" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.53;0.599;0.67;1" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="662" y="92" width="76" height="76" rx="11" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.77;0.836;0.90;1" dur="5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- icon 1: embedded / MCU (cx 130) -->
  <g stroke="#00ff9c" stroke-opacity="0.8" stroke-width="1.8">
    <rect x="112" y="112" width="36" height="36" rx="4" fill="#0d1117"/>
    <line x1="112" y1="122" x2="106" y2="122"/><line x1="112" y1="130" x2="106" y2="130"/><line x1="112" y1="138" x2="106" y2="138"/>
    <line x1="148" y1="122" x2="154" y2="122"/><line x1="148" y1="130" x2="154" y2="130"/><line x1="148" y1="138" x2="154" y2="138"/>
    <line x1="120" y1="112" x2="120" y2="106"/><line x1="130" y1="112" x2="130" y2="106"/><line x1="140" y1="112" x2="140" y2="106"/>
  </g>
  <circle cx="130" cy="130" r="3.5" fill="#00ff9c"/>

  <!-- icon 2: web3 / ETH diamond (cx 320) -->
  <g stroke="#00ff9c" stroke-opacity="0.85" stroke-width="1.7" stroke-linejoin="round">
    <polygon points="320,104 303,132 320,143 337,132" fill="#00ff9c" fill-opacity="0.18"/>
    <polygon points="320,147 304,136 320,160 336,136" fill="#00ff9c" fill-opacity="0.10"/>
  </g>

  <!-- icon 3: fintech / candlesticks (cx 510) -->
  <g stroke="#00ff9c" stroke-opacity="0.85" stroke-width="1.6">
    <line x1="492" y1="110" x2="492" y2="150"/><line x1="510" y1="114" x2="510" y2="152"/><line x1="528" y1="106" x2="528" y2="146"/>
  </g>
  <g fill="#0d1117" stroke="#00ff9c" stroke-opacity="0.85" stroke-width="1.6">
    <rect x="486" y="118" width="12" height="22" rx="1.5"/><rect x="504" y="128" width="12" height="18" rx="1.5"/>
  </g>
  <rect x="522" y="112" width="12" height="22" rx="1.5" fill="#00ff9c" fill-opacity="0.55" stroke="#00ff9c" stroke-opacity="0.85" stroke-width="1.6"/>

  <!-- icon 4: AI / ML mini-net (cx 700) -->
  <g stroke="#00ff9c" stroke-opacity="0.4" stroke-width="1.2">
    <line x1="680" y1="120" x2="700" y2="112"/><line x1="680" y1="120" x2="700" y2="130"/><line x1="680" y1="120" x2="700" y2="148"/>
    <line x1="680" y1="142" x2="700" y2="112"/><line x1="680" y1="142" x2="700" y2="130"/><line x1="680" y1="142" x2="700" y2="148"/>
    <line x1="700" y1="112" x2="720" y2="120"/><line x1="700" y1="130" x2="720" y2="120"/><line x1="700" y1="130" x2="720" y2="142"/><line x1="700" y1="148" x2="720" y2="142"/>
  </g>
  <g fill="#0d1117" stroke="#00ff9c" stroke-opacity="0.85" stroke-width="1.6">
    <circle cx="680" cy="120" r="4"/><circle cx="680" cy="142" r="4"/>
    <circle cx="700" cy="112" r="4"/><circle cx="700" cy="130" r="4"/><circle cx="700" cy="148" r="4"/>
    <circle cx="720" cy="120" r="4"/><circle cx="720" cy="142" r="4"/>
  </g>

  <!-- terminal: uptime node (cx 870) -->
  <line x1="738" y1="130" x2="852" y2="130" stroke="#00ff9c" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="870" cy="130" r="15" fill="#0d1117" stroke="#00ff9c" stroke-width="2"/>
  <path d="M863 130 l5 6 l10 -13" stroke="#00ff9c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="5s" keyTimes="0;0.93;1" repeatCount="indefinite"/>
  </path>

  <!-- captions -->
  <g font-family="'Fira Code',monospace" font-size="11.5" fill="#00ff9c" fill-opacity="0.6" text-anchor="middle">
    <text x="130" y="188">embedded</text>
    <text x="320" y="188">web3</text>
    <text x="510" y="188">fintech</text>
    <text x="700" y="188">AI · ML</text>
    <text x="870" y="188">uptime</text>
  </g>

  <!-- flowing packets along the bus -->
  <g filter="url(#glow)">
    <circle r="4" fill="#ffffff"><animateMotion dur="5s" repeatCount="indefinite"><mpath xlink:href="#bus"/></animateMotion></circle>
    <circle r="3" fill="#00ff9c"><animateMotion dur="5s" begin="2.5s" repeatCount="indefinite"><mpath xlink:href="#bus"/></animateMotion></circle>
  </g>
</svg>
